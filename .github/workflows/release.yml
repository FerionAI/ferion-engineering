name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# One run at a time: merges that land seconds apart used to race, and the slower run shipped a
# release PR built from the files it had read before the newer merge (0.6.0 reverted #26 this way).
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # 1st pass: open/update the release PR from the conventional commits.
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # An open release PR carries the "autorelease: pending" label (release-please adds it).
      - name: Find the open release PR
        id: find
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
                --label "autorelease: pending" --json number,headRefName \
                --jq '.[0].number // empty')
          b=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
                --label "autorelease: pending" --json number,headRefName \
                --jq '.[0].headRefName // empty')
          echo "number=$n" >> "$GITHUB_OUTPUT"
          echo "branch=$b"  >> "$GITHUB_OUTPUT"
          [ -n "$n" ] && echo "Release PR: #$n ($b)" || echo "No open release PR — nothing to ship."

      # The human merge used to be the only gate. Without it, validation MUST run here:
      # it is what stops a broken release from publishing itself.
      - if: steps.find.outputs.number != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.find.outputs.branch }}
      - if: steps.find.outputs.number != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - if: steps.find.outputs.number != ''
        run: pip install pyyaml
      - name: Validate the release contents (the gate that replaces the human merge)
        if: steps.find.outputs.number != ''
        env:
          LEAK_PATTERNS: ${{ secrets.LEAK_PATTERNS }}
        run: sh scripts/validate-plugin.sh

      # Validation reads the PR's own tree, so a stale release PR passes it. What gives it away is
      # the diff: a release only moves version strings and adds a changelog entry — any other removed
      # line is a merge from main being reverted. Fail loudly; the next push rebuilds the PR.
      - name: The release PR only moves versions
        if: steps.find.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bad=$(gh pr diff "${{ steps.find.outputs.number }}" --repo "$GITHUB_REPOSITORY" | awk '
            /^diff --git/ { f = $3; sub(/^a\//, "", f); next }
            /^(---|\+\+\+) / { next }
            /^-/ && f != "CHANGELOG.md" && f != ".release-please-manifest.json" &&
              $0 !~ /x-release-please-version|"version"/ { print f ": " substr($0, 1, 100) }')
          [ -z "$bad" ] || { echo "The release PR removes more than version strings — not shipping it:"; echo "$bad" | head -20; exit 1; }

      - name: Merge the release PR
        if: steps.find.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge "${{ steps.find.outputs.number }}" --repo "$GITHUB_REPOSITORY" --squash --delete-branch

      # 2nd pass, required: a push made with GITHUB_TOKEN does NOT re-trigger workflows.
      # Without this step the PR would merge but the tag and GitHub Release would never be cut.
      - name: Cut the release (tag + GitHub Release)
        if: steps.find.outputs.number != ''
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
